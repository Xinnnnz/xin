<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiTranslate - Translate to Two Languages</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Pinyin Library for Chinese Romanization -->
    <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.18.3/dist/index.js"></script>
    <style>
        body { font-family: 'Inter', 'Noto Sans SC', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

    <!-- Header -->
    <header class="border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-md shadow-indigo-500/20">
                    <i class="fa-solid fa-language text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight tracking-tight">MultiTranslate</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">One Source, Dual Targets</p>
                </div>
            </div>

            <!-- Toolbar actions -->
            <div class="flex items-center space-x-2">
                <button id="history-btn" title="Translation History" class="p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                </button>
                <button id="settings-btn" title="API Key Settings" class="p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                    <i class="fa-solid fa-key"></i>
                </button>
                <button id="theme-toggle" title="Toggle Theme" class="p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:block"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full flex flex-col gap-6">
        
        <!-- Controls Bar -->
        <div class="flex flex-wrap items-center justify-between gap-4 bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
            <div class="flex items-center space-x-3">
                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Presets:</span>
                <button onclick="setPreset('Hej, hur mår du idag?')" class="px-3 py-1 text-xs rounded-full bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-900 hover:bg-indigo-100 transition">Hej, hur mår du?</button>
                <button onclick="setPreset('Programvaruteknik är en spännande disciplin.')" class="px-3 py-1 text-xs rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 transition hidden sm:inline-block">Programvaruteknik</button>
            </div>

            <!-- Font Sizing & Export -->
            <div class="flex items-center space-x-2">
                <div class="flex items-center bg-slate-100 dark:bg-slate-800 rounded-lg p-0.5 border border-slate-200 dark:border-slate-700">
                    <button onclick="adjustFontSize(-1)" class="px-2.5 py-1 text-xs text-slate-600 dark:text-slate-300 hover:bg-white dark:hover:bg-slate-700 rounded transition" title="Decrease Font">A-</button>
                    <button onclick="adjustFontSize(1)" class="px-2.5 py-1 text-xs text-slate-600 dark:text-slate-300 hover:bg-white dark:hover:bg-slate-700 rounded transition" title="Increase Font">A+</button>
                </div>
                <button onclick="exportFile('txt')" class="px-3 py-1.5 text-xs font-medium bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-download"></i><span>Export</span>
                </button>
            </div>
        </div>

        <!-- Translator Grid -->
		<div class="flex flex-col gap-6 flex-1">
			
			<!-- Top: Panel 1 (Full Width Input/Output) -->
			<div class="flex flex-col bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden h-48">
				<div class="px-4 py-3 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between bg-slate-50/50 dark:bg-slate-900/50">
					<div class="flex items-center space-x-2">
						<span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
						<select id="lang-1" class="bg-transparent font-semibold text-sm focus:outline-none cursor-pointer">
							<option value="en" selected>Swedish</option>
							<option value="sv">English</option>
							<option value="zh">Chinese</option>
						</select>
					</div>
					<div class="flex items-center space-x-1">
						<button onclick="document.getElementById('text-1').value=''; translateFrom(1);" title="Clear text" class="p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded transition"><i class="fa-solid fa-trash-can"></i></button>
					</div>
				</div>
				<div class="flex-1 p-4 flex flex-col">
					<textarea id="text-1" placeholder="Type here in any language..." class="w-full flex-1 bg-transparent resize-none focus:outline-none text-slate-800 dark:text-slate-200 placeholder-slate-400 text-base"></textarea>
				</div>
			</div>

			<!-- Bottom Row: Panel 2 & Panel 3 (Side-by-Side Input/Output) -->
			<div class="grid grid-cols-1 md:grid-cols-2 gap-6 flex-1">
				
				<!-- Panel 2 -->
				<div class="flex flex-col bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden h-48">
					<div class="px-4 py-3 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between bg-slate-50/50 dark:bg-slate-900/50">
						<div class="flex items-center space-x-2">
							<span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span>
							<select id="lang-2" class="bg-transparent font-semibold text-sm focus:outline-none cursor-pointer">
								<option value="sv" selected>English</option>
								<option value="en">Swedish</option>
								<option value="zh">Chinese</option>
							</select>
						</div>
						<div class="flex items-center space-x-1">
							<button onclick="document.getElementById('text-2').value=''; translateFrom(2);" title="Clear text" class="p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded transition"><i class="fa-solid fa-trash-can"></i></button>
						</div>
					</div>
					<div class="flex-1 p-4 flex flex-col">
						<textarea id="text-2" placeholder="Translation 2..." class="w-full flex-1 bg-transparent resize-none focus:outline-none text-slate-800 dark:text-slate-200 placeholder-slate-400 text-base"></textarea>
					</div>
				</div>

				<!-- Panel 3 -->
				<div class="flex flex-col bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden h-48">
					<div class="px-4 py-3 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between bg-slate-50/50 dark:bg-slate-900/50">
						<div class="flex items-center space-x-2">
							<span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span>
							<select id="lang-3" class="bg-transparent font-semibold text-sm focus:outline-none cursor-pointer">
								<option value="zh" selected>Chinese</option>
								<option value="en">English</option>
								<option value="sv">Swedish</option>
							</select>
						</div>
						<div class="flex items-center space-x-1">
							<button onclick="document.getElementById('text-3').value=''; translateFrom(3);" title="Clear text" class="p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded transition"><i class="fa-solid fa-trash-can"></i></button>
						</div>
					</div>
					<div class="flex-1 p-4 flex flex-col">
						<textarea id="text-3" placeholder="Translation 3..." class="w-full flex-1 bg-transparent resize-none focus:outline-none text-slate-800 dark:text-slate-200 placeholder-slate-400 text-base"></textarea>
					</div>
				</div>
			</div>
		</div>
    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-xs text-slate-400 border-t border-slate-200 dark:border-slate-800">
        MultiTranslate Web Application &bull; Powered by Gemini AI
    </footer>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl w-full max-w-md p-6 shadow-2xl m-4">
            <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-lg">API Configuration</h3>
                <button onclick="toggleModal('settings-modal', false)" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <p class="text-xs text-slate-500 dark:text-slate-400 mb-4">Provide your Google Gemini API key to enable live AI multi-translations.</p>
            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Gemini API Key</label>
            <input type="password" id="api-key-input" placeholder="AIzaSy..." class="w-full px-3 py-2 border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 rounded-xl text-sm mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <div class="flex justify-end space-x-2">
                <button onclick="toggleModal('settings-modal', false)" class="px-4 py-2 text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition">Cancel</button>
                <button onclick="saveApiKey()" class="px-4 py-2 text-xs font-medium bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow transition">Save Key</button>
            </div>
        </div>
    </div>

    <!-- History Drawer -->
    <div id="history-drawer" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex justify-end hidden">
        <div class="bg-white dark:bg-slate-900 border-l border-slate-200 dark:border-slate-800 w-full max-w-sm h-full flex flex-col shadow-2xl">
            <div class="px-4 py-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                <h3 class="font-bold text-base flex items-center space-x-2"><i class="fa-solid fa-clock-rotate-left text-indigo-500"></i><span>Translation History</span></h3>
                <button onclick="toggleModal('history-drawer', false)" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="history-list" class="flex-1 overflow-y-auto p-4 space-y-3">
                <!-- Dynamic history entries -->
            </div>
        </div>
    </div>

    <!-- Script Application Logic -->
    <script>
        // State Management
        let currentFontSize = 16;
        let apiKey = localStorage.getItem('gemini_api_key') || '';
        let translationHistory = JSON.parse(localStorage.getItem('translation_history')) || [];
		// Variable to hold our typing timeout
		let autoTranslateTimer;
		// Local dictionary for technical terms
		const techDictionary = {
			"debounce": { "sv": "studsa av / debounce", "zh": "防抖" },
			"throttle": { "sv": "strypa / throttle", "zh": "节流" },
			"api": { "sv": "API", "zh": "API" }
		};

		let translationTimer;

		async function translateFrom(sourceIndex) {
			const sourceText = document.getElementById(`text-${sourceIndex}`).value.trim();
			const sourceLang = document.getElementById(`lang-${sourceIndex}`).value;

			const targets = [1, 2, 3].filter(i => i !== sourceIndex);

			if (!sourceText) {
				targets.forEach(i => document.getElementById(`text-${i}`).value = '');
				return;
			}

			targets.forEach(i => document.getElementById(`text-${i}`).value = 'Translating...');

			for (let targetIndex of targets) {
				const targetLang = document.getElementById(`lang-${targetIndex}`).value;
				
				// 1. Check local tech dictionary first
				const lowerText = sourceText.toLowerCase();
				if (techDictionary[lowerText] && techDictionary[lowerText][targetLang]) {
					document.getElementById(`text-${targetIndex}`).value = techDictionary[lowerText][targetLang];
					continue;
				}

				// 2. Call MyMemory API
				try {
					const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(sourceText)}&langpair=${sourceLang}|${targetLang}`);
					const data = await res.json();
					document.getElementById(`text-${targetIndex}`).value = data.responseData.translatedText || 'Translation failed';
				} catch (err) {
					console.error(err);
					document.getElementById(`text-${targetIndex}`).value = 'Error';
				}
			}
		}

		// Attach event listeners to all 3 panels for live typing
		[1, 2, 3].forEach(index => {
			const textArea = document.getElementById(`text-${index}`);
			
			textArea.addEventListener('input', () => {
				clearTimeout(translationTimer);
				translationTimer = setTimeout(() => {
					translateFrom(index);
				}, 600); // 600ms debounce timer
			});

			// Re-translate if dropdown language changes
			document.getElementById(`lang-${index}`).addEventListener('change', () => {
				if (textArea.value.trim()) {
					translateFrom(index);
				}
			});
		});
		// 1. Listen for typing in the source text box
		document.getElementById('source-text').addEventListener('input', () => {
			clearTimeout(autoTranslateTimer); // Reset the timer on every new keystroke
			
			const text = document.getElementById('source-text').value.trim();
			
			if (!text) {
				// Clear outputs if the text box is empty
				document.getElementById('target-1-text').innerText = 'Translation 1 will appear here...';
				document.getElementById('target-2-text').innerText = 'Translation 2 will appear here...';
				return;
			}

			// Wait 600ms after the user stops typing, then trigger handleTranslate()
			autoTranslateTimer = setTimeout(() => {
				handleTranslate();
			}, 600);
		});

		// 2. Optional: Trigger translation immediately if language dropdowns change
		['source-lang', 'target-lang-1', 'target-lang-2'].forEach(id => {
			const element = document.getElementById(id);
			if (element) {
				element.addEventListener('change', () => {
					if (document.getElementById('source-text').value.trim()) {
						handleTranslate();
					}
				});
			}
		});

        // Theme Toggle
        const themeToggleBtn = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlElement.classList.add('dark');
        } else {
            htmlElement.classList.remove('dark');
        }
        themeToggleBtn.addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            localStorage.theme = htmlElement.classList.contains('dark') ? 'dark' : 'light';
        });

        // Modals
        document.getElementById('settings-btn').addEventListener('click', () => {
            document.getElementById('api-key-input').value = apiKey;
            toggleModal('settings-modal', true);
        });
        document.getElementById('history-btn').addEventListener('click', () => {
            renderHistory();
            toggleModal('history-drawer', true);
        });

        function toggleModal(modalId, show) {
            const modal = document.getElementById(modalId);
            if (show) modal.classList.remove('hidden');
            else modal.classList.add('hidden');
        }

        function saveApiKey() {
            apiKey = document.getElementById('api-key-input').value.trim();
            localStorage.setItem('gemini_api_key', apiKey);
            toggleModal('settings-modal', false);
            alert('API key saved successfully!');
        }

        // Source Controls
        const sourceText = document.getElementById('source-text');
        sourceText.addEventListener('input', () => {
            document.getElementById('char-count').innerText = `${sourceText.value.length} characters`;
        });

        function clearSource() {
            sourceText.value = '';
            document.getElementById('char-count').innerText = '0 characters';
        }

        async function pasteText() {
            try {
                const text = await navigator.clipboard.readText();
                sourceText.value = text;
                document.getElementById('char-count').innerText = `${text.length} characters`;
            } catch (err) {
                alert('Clipboard access denied or unsupported.');
            }
        }

        function setPreset(text) {
            sourceText.value = text;
            document.getElementById('char-count').innerText = `${text.length} characters`;
            handleTranslate();
        }

        // Font Size Adjuster
        function adjustFontSize(delta) {
            currentFontSize = Math.max(12, Math.min(24, currentFontSize + delta));
            sourceText.style.fontSize = `${currentFontSize}px`;
            document.getElementById('target-1-text').style.fontSize = `${currentFontSize}px`;
            document.getElementById('target-2-text').style.fontSize = `${currentFontSize}px`;
        }

        // Translation Engine (MyMemory API)
		async function handleTranslate() {
			const text = sourceText.value.trim();
			if (!text) return;

			// Convert language names to 2-letter ISO codes (e.g., Swedish -> "sv", English -> "en", Chinese -> "zh")
			const src = 'sv';
			const lang1 = 'en';
			const lang2 = 'zh';

			document.getElementById('target-1-text').innerText = 'Translating...';
			document.getElementById('target-2-text').innerText = 'Translating...';

			try {
				const [res1, res2] = await Promise.all([
					fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${src}|${lang1}`),
					fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${src}|${lang2}`)
				]);

				const data1 = await res1.json();
				const data2 = await res2.json();

				document.getElementById('target-1-text').innerText = data1.responseData.translatedText;
				document.getElementById('target-2-text').innerText = data2.responseData.translatedText;
			} catch (err) {
				console.error(err);
			}
		}

        // History Management
        function saveHistory(src, t1, t2) {
            translationHistory.unshift({ src, t1, t2, time: new Date().toLocaleTimeString() });
            if (translationHistory.length > 10) translationHistory.pop();
            localStorage.setItem('translation_history', JSON.stringify(translationHistory));
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            if (translationHistory.length === 0) {
                list.innerHTML = '<p class="text-xs text-slate-400 text-center py-6">No recent translations.</p>';
                return;
            }
            list.innerHTML = translationHistory.map(item => `
                <div class="p-3 bg-slate-50 dark:bg-slate-800/50 rounded-xl border border-slate-100 dark:border-slate-800 text-xs">
                    <div class="text-slate-400 font-semibold mb-1">${item.time}</div>
                    <div class="text-slate-700 dark:text-slate-300 font-medium truncate mb-1">Src: ${item.src}</div>
                    <div class="text-indigo-600 dark:text-indigo-400 truncate">1: ${item.t1}</div>
                    <div class="text-rose-600 dark:text-rose-400 truncate">2: ${item.t2}</div>
                </div>
            `).join('');
        }

        // Utility: Copy & Speech
        function copyText(elementId) {
            const text = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert('Copied to clipboard!');
            });
        }

        function speakText(elementId, langCode) {
            const text = document.getElementById(elementId).innerText;
            if (!text || text.includes('will appear here')) return;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = langCode;
            window.speechSynthesis.speak(utterance);
        }

        function exportFile(format) {
            const t1 = document.getElementById('target-1-text').innerText;
            const t2 = document.getElementById('target-2-text').innerText;
            const content = `Source: ${sourceText.value}\nTarget 1: ${t1}\nTarget 2: ${t2}`;
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'multitranslate_export.txt';
            a.click();
        }
    </script>
</body>
</html>
